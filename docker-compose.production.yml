# ============================================================
# ⚠️  CRITICAL PRODUCTION FILE - DO NOT EDIT WITHOUT READING:
#     backend/HOSTING_INFRASTRUCTURE.md
# ============================================================
#
# CiteKit - Digital Ocean Droplet Deployment
# ========================================
#
# This docker-compose file is for PRODUCTION deployment on a DO Droplet
# Uses Nginx reverse proxy with SSL via Cloudflare Origin Certificates
#
# REQUIREMENTS:
# - Digital Ocean Droplet (2GB RAM minimum, 4GB recommended)
# - Ubuntu 22.04 LTS
# - Domain pointing to Droplet IP via Cloudflare
# - Cloudflare Origin Certificate at /etc/ssl/cloudflare/ on HOST
# - .env file with all secrets
#

services:
  # ===========================================
  # Nginx Reverse Proxy + SSL (Cloudflare Origin Cert)
  # ===========================================
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - /etc/ssl/cloudflare:/etc/ssl/cloudflare:ro
    depends_on:
      - api
    restart: unless-stopped
    networks:
      - citekit-network

  # ===========================================
  # FastAPI Backend
  # ===========================================
  api:
    build:
      context: .
      dockerfile: Dockerfile.production
    environment:
      - REDIS_URL=redis://redis:6379/0
      - PORT=8000
    env_file:
      - .env
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - ./output:/app/output
      - ./logs:/app/logs
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8000/health/live" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - citekit-network
    deploy:
      resources:
        limits:
          memory: 1G

  # ===========================================
  # Celery Worker (Background Jobs)
  # ===========================================
  worker:
    build:
      context: .
      dockerfile: Dockerfile.production
    command: celery -A celery_app worker --loglevel=info --concurrency=4 --prefetch-multiplier=1
    environment:
      - REDIS_URL=redis://redis:6379/0
    env_file:
      - .env
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - ./output:/app/output
      - ./logs:/app/logs
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "celery", "-A", "celery_app", "inspect", "ping", "-d", "celery@$$HOSTNAME" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - citekit-network
    deploy:
      resources:
        limits:
          memory: 3G

  # ===========================================
  # Redis (Celery Message Broker)
  # ===========================================
  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - citekit-network

networks:
  citekit-network:
    driver: bridge

volumes:
  redis_data:
