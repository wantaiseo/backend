# GitHub Actions Workflow: Auto-Deploy Backend to DigitalOcean
# Triggers on push to main branch
# SSHs into droplet, pulls latest code, rebuilds Docker containers

name: Deploy Backend

on:
  push:
    branches:
      - main
  workflow_dispatch:  # Allow manual trigger from GitHub UI

jobs:
  deploy:
    name: Deploy to DigitalOcean
    runs-on: ubuntu-latest
    
    steps:
      - name: 🚀 Deploy to Droplet
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DROPLET_IP }}
          username: ${{ secrets.DROPLET_USER }}
          password: ${{ secrets.DROPLET_PASSWORD }}
          port: 22
          script: |
            echo "📦 Starting deployment..."
            
            # Navigate to backend directory
            cd /app
            
            # Pull latest code (Force clean state)
            echo "⬇️ Pulling latest code..."
            git fetch --all
            git reset --hard origin/main
            
            # Stop any containers from default compose (cleanup)
            echo "🛑 Stopping old containers..."
            docker compose down 2>/dev/null || true
            
            # Rebuild and restart using PRODUCTION compose file
            # IMPORTANT: Use docker-compose.production.yml which has nginx + correct networks
            echo "🐳 Rebuilding Docker containers..."
            docker compose -f docker-compose.production.yml down
            docker compose -f docker-compose.production.yml build
            docker compose -f docker-compose.production.yml up -d --force-recreate
            
            # Wait for services to be healthy
            echo "⏳ Waiting for services to start..."
            sleep 10
            
            # Health check
            echo "🏥 Health check..."
            curl -s http://localhost:8000/health || echo "Warning: Health check failed"
            
            # Clean up old images
            echo "🧹 Cleaning up..."
            docker image prune -f
            
            echo "✅ Deployment complete!"

      - name: 📢 Notify Success
        if: success()
        run: echo "Deployment successful! 🎉"

      - name: ❌ Notify Failure  
        if: failure()
        run: echo "Deployment failed! Check the logs above."
