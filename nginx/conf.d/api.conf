# ========================================
# CiteKit API - Server Configuration
# ========================================
# INSTRUCTIONS:
# 1. Replace YOUR_DOMAIN.com with your actual domain
# 2. First run with HTTP only to get SSL certificate
# 3. Then uncomment the HTTPS section
# ========================================

# Upstream for API
upstream api_backend {
    server api:8000;
    keepalive 32;
}

# HTTP Server (redirect to HTTPS after SSL is set up)
server {
    listen 80;
    listen [::]:80;
    server_name YOUR_DOMAIN.com api.YOUR_DOMAIN.com;

    # Let's Encrypt challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # After SSL is set up, uncomment this redirect:
    # location / {
    #     return 301 https://$host$request_uri;
    # }

    # For initial setup without SSL, proxy to API:
    location / {
        proxy_pass http://api_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        
        # Timeouts for long-running requests
        proxy_connect_timeout 60s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }
}

