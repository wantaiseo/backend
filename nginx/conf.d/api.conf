# ============================================================
# ⚠️  CRITICAL PRODUCTION FILE - DO NOT EDIT WITHOUT READING:
#     backend/HOSTING_INFRASTRUCTURE.md
#
#     SSL: Uses Cloudflare Origin Certs at /etc/ssl/cloudflare/
#     DO NOT change to Let's Encrypt / certbot paths!
# ============================================================

upstream api_backend {
    server api:8000;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name wantaiseo.com api.wantaiseo.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name wantaiseo.com api.wantaiseo.com;

    # Cloudflare Origin Certificate (DO NOT USE LET'S ENCRYPT)
    ssl_certificate /etc/ssl/cloudflare/origin.pem;
    ssl_certificate_key /etc/ssl/cloudflare/origin.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:50m;

    location / {
        proxy_pass http://api_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 60s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }
}
